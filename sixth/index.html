<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね
    $(function () {
      function backFirstScreen(){
        let searchBtnHtml =
        `
          <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
        `
        $('[data-js="reset"]').on("click", function(){
          $(".wrapper").html(searchBtnHtml);
        });
      };

      function pokeGet(){
        let randomPokeNum = Math.floor(Math.random() * 151) + 1;
        console.log(randomPokeNum);
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${randomPokeNum}` ,
          method: 'GET'
        }).done(function(res1) {
          let failHtml =
          `
            <p class="text">逃げられてしまった...</p>
            <button class="btn mt" data-js="reset">戻る</button>
          `

          let encountHtml =
          `
            <p class="name"></p>
            <div>
              <img class="img" src="${res1.sprites.front_default}" alt="">
            </div>
            <div>
              <button class="btn" id="catch">捕まえる</button>
              <button class="btn" data-js="reset">逃げる</button>
            </div>
          `

          $.ajax({
            url: 'https://pokeapi.co/api/v2/item/4',
            method: 'GET'
          }).done(function(res2) {
            let doneHtml =
            `
              <p class="name">ゲットしました</p>
              <div>
                <img class="img" src="${res2.sprites.default}" alt="">
              </div>
              <button class="btn" data-js="reset">戻る</button>
            `

            $(".wrapper").html(encountHtml);
            $("#catch").on("click",function(){
              let value = Math.floor(Math.random() * 100) + 1;
              console.log(value);
              if(value >= 50){
                $(".wrapper").html(doneHtml);
                backFirstScreen();
              }else{
                $(".wrapper").html(failHtml);
                backFirstScreen();
              }
            });
            backFirstScreen();
          }).fail(function(err) {
            console.log("failed getting item")
          });
        }).fail(function(err) {
          console.log("failed getting poke");
        });
      };

      $(".wrapper").on("click", ".search-btn", function(){
        pokeGet();
      });
    });
  </script>
</body>
</html>
